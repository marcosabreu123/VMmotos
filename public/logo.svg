<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="VM Moto Peças">
  <title>VM Moto Peças</title>
  <defs>
    <linearGradient id="cromado" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d8dce1"/>
      <stop offset="55%" stop-color="#7f868f"/>
      <stop offset="100%" stop-color="#c6ccd3"/>
    </linearGradient>
    <linearGradient id="vermelho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f42730"/>
      <stop offset="100%" stop-color="#b3141a"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="98" fill="#0a0a0b"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#vermelho)" stroke-width="6"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#d8dce1" stroke-width="1.5" opacity="0.55"/>

  <text x="100" y="104" text-anchor="middle"
        font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
        font-size="78" font-weight="700" font-style="italic"
        fill="url(#cromado)" letter-spacing="-2">VM</text>

  <rect x="42" y="118" width="116" height="3" fill="url(#vermelho)"/>

  <text x="100" y="146" text-anchor="middle"
        font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
        font-size="23" font-weight="600" letter-spacing="2.5"
        fill="#f3f4f5">MOTO PEÇAS</text>

  <text x="100" y="166" text-anchor="middle"
        font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
        font-size="11" font-weight="500" letter-spacing="1.8"
        fill="#9ba0a7">QUALIDADE E CONFIANÇA</text>
</svg>
